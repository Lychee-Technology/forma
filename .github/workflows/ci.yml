name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: forma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: forma_test
        run: go test -v -race -coverprofile=coverage.out . ./cdc ./cmd/... ./factory ./internal/...

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run E2E harness tests
        run: go test -v ./internal/e2e_harness/... -timeout=5m

      - name: Run E2E federated smoke tests
        run: go test -v ./internal/e2e_harness/federated/... -tags=e2e -short -timeout=10m

      - name: Run E2E production harness smoke
        run: make test-e2e-production

  k6-smoke:
    name: k6 Smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start infrastructure (Postgres + RustFS)
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Build tools and server
        run: make build-all

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec forma-postgres pg_isready -U postgres >/dev/null 2>&1; then echo "Postgres ready"; exit 0; fi
            sleep 1
          done
          echo "Postgres did not become ready" >&2; exit 1

      - name: Initialize database
        run: |
          ./build/tools init-db \
            --db-host localhost --db-port 5432 --db-name forma \
            --db-user postgres --db-password postgres --db-ssl-mode disable \
            --schema-table schema_registry_dev --eav-table eav_data_dev \
            --entity-main-table entity_main_dev --schema-dir cmd/server/schemas

      - name: Start server (DuckDB federated engine enabled)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: forma
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL_MODE: disable
          PORT: 8080
          SCHEMA_DIR: cmd/server/schemas
          # Enable the federated DuckDB engine against the compose RustFS so the
          # smoke genuinely exercises the warm/cold S3 read path, not just Postgres.
          DUCKDB_ENABLED: "true"
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio_password
          # Manifest-driven reads (#302): the flush step below writes
          # manifests (cdc-flush passes --manifest-template); these vars make
          # the server resolve parquet paths from them instead of relying on
          # per-request hints. S3_BUCKET/S3_PREFIX mirror the tests/e2e
          # defaults (forma-cdc / delta) the writers use.
          DUCKDB_MANIFEST_TEMPLATE: "manifest/{{.SchemaID}}.json"
          S3_BUCKET: forma-cdc
          S3_PREFIX: delta
        run: |
          ./build/server &
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8080/api/v1/lead?page=1&items_per_page=1" >/dev/null 2>&1; then echo "Server up"; exit 0; fi
            sleep 1
          done
          echo "Server did not become ready" >&2; exit 1

      - name: Seed + flush + federated consistency + DuckDB route
        working-directory: tests/e2e
        run: |
          bun install
          bun run register-schemas
          bun run gen-data -- --schema all --count 2000
          bun run cdc-flush
          # Row-identity consistency across all schemas (hybrid → Postgres route).
          bun run federated-check -- --schema all
          # Prove the federated read actually goes through DuckDB/S3. 'log' is a
          # flat schema; lead/visit have nested dotted attributes that currently
          # hit a federated-projection binder bug (tracked separately).
          bun run federated-check -- --schema log --require-duckdb
          # Same route proof without the client-side path hint: an explicit
          # hint always wins over the manifest source, so only a hint-free
          # request exercises the server's manifest-driven read path (#302).
          bun run federated-check -- --schema log --require-duckdb --manifest-reads

      # OLTP-path load smoke. The DuckDB route is proven above by
      # federated-check --require-duckdb; the k6 latency SLA deliberately does
      # not include the seconds-slow federated reads.
      - name: k6 smoke (OLTP load)
        working-directory: tests/e2e
        run: SKIP_SEED=1 bun run k6-smoke

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-smoke-report
          path: tests/e2e/reports/k6-smoke.json
          retention-days: 14

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run benchmark smoke validation
        run: make benchmark-smoke

      - name: Upload benchmark smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke
          path: .artifacts/benchmark/smoke/
          retention-days: 14
