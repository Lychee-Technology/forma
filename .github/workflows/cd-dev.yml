name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0). Leave empty for latest release.'
        required: false
        default: ''

env:
  GO_VERSION: '1.26.0'
  AWS_REGION: us-east-2
  ENVIRONMENT: dev
  LAMBDA_FUNCTION_NAME: forma-dev-api
  LAMBDA_MEMORY: 1024
  LAMBDA_TIMEOUT: 30

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: ${{ github.env.ENVIRONMENT }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version to deploy
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            # Get latest release tag
            VERSION=$(gh release view --json tagName -q '.tagName')
            echo "Using latest release: ${VERSION}"
          else
            VERSION="${{ inputs.version }}"
            echo "Using specified version: ${VERSION}"
          fi
          
          # Verify the release exists
          if ! gh release view "${VERSION}" > /dev/null 2>&1; then
            echo "::error::Release ${VERSION} not found"
            exit 1
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download Lambda from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading lambda-arm64.zip from release ${{ steps.version.outputs.version }}..."
          gh release download "${{ steps.version.outputs.version }}" \
            --pattern "lambda-arm64.zip" \
            --output lambda.zip
          
          ls -lh lambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Pulumi
        uses: pulumi/actions@v5

      - name: Get infrastructure outputs
        id: infra
        working-directory: ./infra
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi login s3://${{ secrets.PULUMI_STATE_BUCKET }}
          go mod download
          
          # Get outputs from Pulumi stack
          echo "deployment-bucket=$(pulumi stack output lambdaDeploymentBucket --stack ${{ env.ENVIRONMENT }})" >> $GITHUB_OUTPUT
          echo "role-arn=$(pulumi stack output lambdaRoleArn --stack ${{ env.ENVIRONMENT }})" >> $GITHUB_OUTPUT
          echo "api-gateway-id=$(pulumi stack output apiGatewayId --stack ${{ env.ENVIRONMENT }})" >> $GITHUB_OUTPUT
          echo "api-gateway-execution-arn=$(pulumi stack output apiGatewayExecutionArn --stack ${{ env.ENVIRONMENT }})" >> $GITHUB_OUTPUT
          echo "api-endpoint=$(pulumi stack output apiEndpoint --stack ${{ env.ENVIRONMENT }})" >> $GITHUB_OUTPUT
          echo "dsql-endpoint=$(pulumi stack output dsqlClusterEndpoint --stack ${{ env.ENVIRONMENT }})" >> $GITHUB_OUTPUT
          echo "s3-bucket=$(pulumi stack output s3BucketName --stack ${{ env.ENVIRONMENT }})" >> $GITHUB_OUTPUT
          echo "log-group-arn=$(pulumi stack output logGroupArn --stack ${{ env.ENVIRONMENT }})" >> $GITHUB_OUTPUT

      - name: Upload Lambda to S3
        id: upload
        run: |
          S3_KEY="lambda-${{ steps.version.outputs.version }}.zip"
          aws s3 cp lambda.zip "s3://${{ steps.infra.outputs.deployment-bucket }}/${S3_KEY}"
          echo "s3-key=${S3_KEY}" >> $GITHUB_OUTPUT

      - name: Check if Lambda function exists
        id: check-lambda
        run: |
          if aws lambda get-function --function-name ${{ env.LAMBDA_FUNCTION_NAME }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Lambda function
        if: steps.check-lambda.outputs.exists == 'false'
        run: |
          echo "Creating Lambda function ${{ env.LAMBDA_FUNCTION_NAME }}..."
          
          aws lambda create-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --runtime provided.al2023 \
            --architectures arm64 \
            --handler bootstrap \
            --role "${{ steps.infra.outputs.role-arn }}" \
            --code S3Bucket=${{ steps.infra.outputs.deployment-bucket }},S3Key=${{ steps.upload.outputs.s3-key }} \
            --timeout ${{ env.LAMBDA_TIMEOUT }} \
            --memory-size ${{ env.LAMBDA_MEMORY }} \
            --environment "Variables={VERSION=${{ steps.version.outputs.version }},ENVIRONMENT=${{ env.ENVIRONMENT }},DSQL_ENDPOINT=${{ steps.infra.outputs.dsql-endpoint }},S3_BUCKET=${{ steps.infra.outputs.s3-bucket }},DB_NAME=postgres,DB_USER=admin,DB_PORT=5432,DB_SSL_MODE=require,AWS_REGION=${{ env.AWS_REGION }},LOG_LEVEL=info}" \
            --tags "Environment=${{ env.ENVIRONMENT }},ManagedBy=github-actions,Version=${{ steps.version.outputs.version }}"
          
          # Wait for function to be active
          aws lambda wait function-active --function-name ${{ env.LAMBDA_FUNCTION_NAME }}

      - name: Update Lambda function code
        if: steps.check-lambda.outputs.exists == 'true'
        run: |
          echo "Updating Lambda function code..."
          
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --s3-bucket ${{ steps.infra.outputs.deployment-bucket }} \
            --s3-key ${{ steps.upload.outputs.s3-key }}
          
          aws lambda wait function-updated --function-name ${{ env.LAMBDA_FUNCTION_NAME }}
          
          echo "Updating Lambda function configuration..."
          
          aws lambda update-function-configuration \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --timeout ${{ env.LAMBDA_TIMEOUT }} \
            --memory-size ${{ env.LAMBDA_MEMORY }} \
            --environment "Variables={VERSION=${{ steps.version.outputs.version }},ENVIRONMENT=${{ env.ENVIRONMENT }},DSQL_ENDPOINT=${{ steps.infra.outputs.dsql-endpoint }},S3_BUCKET=${{ steps.infra.outputs.s3-bucket }},DB_NAME=postgres,DB_USER=admin,DB_PORT=5432,DB_SSL_MODE=require,AWS_REGION=${{ env.AWS_REGION }},LOG_LEVEL=info}"
          
          aws lambda wait function-updated --function-name ${{ env.LAMBDA_FUNCTION_NAME }}

      - name: Get Lambda ARN
        id: lambda
        run: |
          LAMBDA_ARN=$(aws lambda get-function --function-name ${{ env.LAMBDA_FUNCTION_NAME }} --query 'Configuration.FunctionArn' --output text)
          echo "arn=${LAMBDA_ARN}" >> $GITHUB_OUTPUT

      - name: Check if API Gateway integration exists
        id: check-integration
        run: |
          # List integrations and check if Lambda integration exists
          INTEGRATIONS=$(aws apigatewayv2 get-integrations --api-id ${{ steps.infra.outputs.api-gateway-id }} --query 'Items[?IntegrationType==`AWS_PROXY`].IntegrationId' --output text)
          
          if [ -n "$INTEGRATIONS" ] && [ "$INTEGRATIONS" != "None" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "integration-id=${INTEGRATIONS}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create API Gateway Lambda integration
        if: steps.check-integration.outputs.exists == 'false'
        id: create-integration
        run: |
          echo "Creating API Gateway Lambda integration..."
          
          INTEGRATION_ID=$(aws apigatewayv2 create-integration \
            --api-id ${{ steps.infra.outputs.api-gateway-id }} \
            --integration-type AWS_PROXY \
            --integration-uri ${{ steps.lambda.outputs.arn }} \
            --integration-method POST \
            --payload-format-version "2.0" \
            --query 'IntegrationId' \
            --output text)
          
          echo "integration-id=${INTEGRATION_ID}" >> $GITHUB_OUTPUT

      - name: Update API Gateway Lambda integration
        if: steps.check-integration.outputs.exists == 'true'
        run: |
          echo "Updating API Gateway Lambda integration..."
          
          aws apigatewayv2 update-integration \
            --api-id ${{ steps.infra.outputs.api-gateway-id }} \
            --integration-id ${{ steps.check-integration.outputs.integration-id }} \
            --integration-uri ${{ steps.lambda.outputs.arn }}

      - name: Set integration ID
        id: integration
        run: |
          if [ "${{ steps.check-integration.outputs.exists }}" == "true" ]; then
            echo "id=${{ steps.check-integration.outputs.integration-id }}" >> $GITHUB_OUTPUT
          else
            echo "id=${{ steps.create-integration.outputs.integration-id }}" >> $GITHUB_OUTPUT
          fi

      - name: Check if API Gateway route exists
        id: check-route
        run: |
          ROUTES=$(aws apigatewayv2 get-routes --api-id ${{ steps.infra.outputs.api-gateway-id }} --query 'Items[?RouteKey==`$default`].RouteId' --output text)
          
          if [ -n "$ROUTES" ] && [ "$ROUTES" != "None" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "route-id=${ROUTES}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create API Gateway route
        if: steps.check-route.outputs.exists == 'false'
        run: |
          echo "Creating API Gateway default route..."
          
          aws apigatewayv2 create-route \
            --api-id ${{ steps.infra.outputs.api-gateway-id }} \
            --route-key '$default' \
            --target "integrations/${{ steps.integration.outputs.id }}"

      - name: Update API Gateway route
        if: steps.check-route.outputs.exists == 'true'
        run: |
          echo "Updating API Gateway default route..."
          
          aws apigatewayv2 update-route \
            --api-id ${{ steps.infra.outputs.api-gateway-id }} \
            --route-id ${{ steps.check-route.outputs.route-id }} \
            --target "integrations/${{ steps.integration.outputs.id }}"

      - name: Add Lambda permission for API Gateway
        run: |
          # Remove existing permission if it exists (ignore errors)
          aws lambda remove-permission \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --statement-id apigateway-invoke 2>/dev/null || true
          
          # Add permission
          aws lambda add-permission \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --statement-id apigateway-invoke \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "${{ steps.infra.outputs.api-gateway-execution-arn }}/*/*"

      - name: Health check
        run: |
          API_ENDPOINT="${{ steps.infra.outputs.api-endpoint }}"
          echo "Checking health at ${API_ENDPOINT}/health"
          
          # Retry up to 5 times with 10 second intervals
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${API_ENDPOINT}/health" || echo "000")
            
            if [ "$HTTP_CODE" == "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            
            echo "Attempt $i: HTTP ${HTTP_CODE}, retrying in 10 seconds..."
            sleep 10
          done
          
          echo "::error::Health check failed after 5 attempts"
          exit 1

      - name: Deployment summary
        run: |
          echo "## Dev Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lambda Function | ${{ env.LAMBDA_FUNCTION_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Endpoint | ${{ steps.infra.outputs.api-endpoint }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "To deploy this version to production, run the **Deploy to Production** workflow." >> $GITHUB_STEP_SUMMARY
